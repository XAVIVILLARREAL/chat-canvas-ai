name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsgo)
        run: pnpm typecheck

      - name: Lint (biome)
        run: pnpm lint

      - name: Knip (código muerto)
        run: pnpm lint:dead

      - name: Tests frontend
        run: pnpm test

      - name: Tests Rust
        run: cargo test --workspace

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: pnpm build:frontend

      - name: E2E funcional (browser mode)
        run: npx playwright test --config=e2e/playwright.config.ts --project=chromium

      - name: Suite humana @core
        run: |
          nohup npx vite --port 1420 > /dev/null 2>&1 &
          sleep 5
          pnpm test:e2e:human:core

  build-desktop:
    # SDD-005: verifica que el código compila en los 3 SO desktop (DoD: 2+ plataformas)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build:frontend

      - name: Compilar Rust (check, sin bundle)
        run: cargo check --workspace
