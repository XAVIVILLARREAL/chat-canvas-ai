name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsgo)
        run: pnpm typecheck

      - name: Lint (biome)
        run: pnpm lint

      - name: Tests frontend
        run: pnpm test

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  empresa-autonoma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar servicio
        run: |
          python -m pip install --upgrade pip
          pip install langgraph typing-extensions pytest

      - name: Tests del grafo
        run: cd empresa_autonoma && python -m pytest tests -q
