name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: stable

      - name: Instalar Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Análisis estático (packages)
        run: melos exec -- "dart analyze ."

      - name: Análisis de la app
        run: cd apps/empresa_dev && flutter analyze

      - name: Tests unitarios (packages)
        run: melos exec -- "dart test"

      - name: Tests de la app (sin integración)
        run: cd apps/empresa_dev && flutter test --exclude-tags integration

  empresa-autonoma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar servicio (mínimo para el grafo)
        run: |
          python -m pip install --upgrade pip
          pip install langgraph typing-extensions pytest

      - name: Tests headless del grafo (sin LLM)
        run: cd empresa_autonoma && python -m pytest tests -q

  # E2E web del flujo crítico (Etapa 7, SDD-120): build web con semántica,
  # servidor estático y Playwright headless por PR.
  e2e-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: stable

      - name: Build web (semántica E2E)
        run: cd apps/empresa_dev && flutter build web --debug --dart-define=E2E_WEB=true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar Playwright
        working-directory: apps/empresa_dev/tool
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Servidor estático + E2E Playwright
        working-directory: apps/empresa_dev/tool
        run: |
          python3 -m http.server 8765 --directory ../build/web &
          sleep 2
          npx playwright test
