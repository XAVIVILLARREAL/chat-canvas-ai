name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: stable

      - name: Instalar Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Análisis estático (packages)
        run: melos exec -- "dart analyze ."

      - name: Análisis de la app
        run: cd apps/empresa_dev && flutter analyze

      - name: Tests unitarios (packages)
        run: melos exec -- "dart test"

      - name: Tests de la app (sin integración)
        run: cd apps/empresa_dev && flutter test --exclude-tags integration

  empresa-autonoma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar servicio (mínimo para el grafo)
        run: |
          python -m pip install --upgrade pip
          pip install langgraph typing-extensions pytest

      - name: Tests headless del grafo (sin LLM)
        run: cd empresa_autonoma && python -m pytest tests -q
