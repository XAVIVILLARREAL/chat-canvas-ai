name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsgo)
        run: pnpm typecheck

      - name: Lint (biome)
        run: pnpm lint

      - name: Knip (código muerto)
        run: pnpm lint:dead

      - name: Tests frontend
        run: pnpm test

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: pnpm build:frontend

      - name: E2E funcional (browser mode)
        run: npx playwright test --config=e2e/playwright.config.ts --project=chromium

      - name: Suite humana @core
        run: |
          nohup npx vite --port 1420 > /dev/null 2>&1 &
          sleep 5
          pnpm test:e2e:human:core
