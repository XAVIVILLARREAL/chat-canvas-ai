name: release

# Publica instaladores desktop en GitHub Releases al crear un tag v*
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck + tests
        run: pnpm check:all && pnpm test

      - name: Generar SBOM (cyclonedx)
        run: |
          # Cargo SBOM (si cargo-cyclonedx está disponible en CI) — ver plan-t T.SEC
          cargo install cargo-cyclonedx --locked 2>/dev/null || echo "cargo-cyclonedx opcional"
          # Documentar el tag en CHANGELOG (ya versionado por el autor)

      - name: Build Tauri (Linux)
        run: pnpm build

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
          generate_release_notes: true

  # Windows/macOS requieren runners propios; habilitar cuando existan credenciales de firma
  # build-windows: runs-on: windows-latest ...
  # build-macos: runs-on: macos-latest ...
