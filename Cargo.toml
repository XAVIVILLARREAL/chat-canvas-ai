[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/worker", "src-tauri"]

# ADR-005 D1 + SDD-008: un solo dominio Rust (crates/core) consumido por:
# el shell Tauri (diferido), el servidor axum (gateway) y el worker stateless (Everruns).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "2.0.0-rc.25", features = ["derive", "serde_json"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"
dashmap = "5"
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
schemars = "0.8"
rmcp = { version = "0.1", features = ["server", "client"] }  # MCP SDK
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "migrate", "json", "chrono"] }
aes-gcm = "0.10"
base64 = "0.22"