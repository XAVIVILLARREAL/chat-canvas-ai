[package]
name = "canvas-ai"
version = "0.1.0"
description = "Canvas AI — plataforma visual de automatización con agentes"
authors = ["you"]
edition = "2021"

[lib]
name = "canvas_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Activa el registro del plugin playwright en runtime (ver lib.rs).
# La dependencia NO es opcional para que tauri-build siempre valide el permiso "playwright:default".
e2e-testing = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
canvas-ai-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-playwright = "0.4"
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript = "0.0.12"
tauri-specta = { version = "2.0.0-rc.25", features = ["typescript", "derive"] }
tokio.workspace = true
