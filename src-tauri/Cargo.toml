[package]
name = "empresa-dev"
version = "0.1.0"
description = "Sistema multiagente visual para crear empresas de desarrollo"
authors = ["you"]
edition = "2021"

[lib]
name = "empresa_dev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
e2e-testing = ["tauri-plugin-playwright"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-playwright = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "2.0.0-rc.25", features = ["typescript", "derive"] }
tokio = { version = "1", features = ["full"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
