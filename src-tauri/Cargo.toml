[package]
name = "empresa-dev"
version = "0.1.0"
description = "Sistema multiagente visual para crear empresas de desarrollo"
authors = ["you"]
edition = "2021"

[lib]
name = "empresa_dev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Activa el registro del plugin playwright en runtime (ver lib.rs).
# La dependencia NO es opcional para que tauri-build siempre valide el permiso "playwright:default".
e2e-testing = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-playwright = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "2.0.0-rc.25", features = ["typescript", "derive"] }
tokio = { version = "1", features = ["full"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
